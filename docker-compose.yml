version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: pokedex_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: pokedex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Executa automaticamente na primeira inicialização:
      - ./sql/create_tables.sql:/docker-entrypoint-initdb.d/1_create_tables.sql
      - ./sql/inserts_iniciais.sql:/docker-entrypoint-initdb.d/2_inserts_iniciais.sql

volumes:
  pgdata:
